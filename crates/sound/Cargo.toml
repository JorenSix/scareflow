[package]
name = "scareflow-sound"
description = "Scareflow sound module: looping background music with one-shot effects on top"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "vorbis", "wav"] }

# Plays through the sound server (PulseAudio, or PipeWire via pipewire-pulse) when one runs,
# so its outputs can be picked by name while it holds the sound cards open.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[dev-dependencies]
hound = "3.5"
