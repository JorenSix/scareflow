[package]
name = "scareflow-showui"
description = "Desktop control panel for Scareflow sound and scare responses to OSC and keyboard events"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui-snarl = "0.9.0"
env_logger = "0.11"
log = "0.4"
scareflow-osc = { path = "../osc" }
scareflow-sound = { path = "../sound" }
rosc = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Linux needs a display backend; Wayland for GNOME, X11 as fallback.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["wayland", "x11"] }
